name: PR Validation Gate (CI)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint-and-sast:
    name: Linters & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: vote/Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: result/Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: worker/Dockerfile
          failure-threshold: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Flake8 and Bandit
        run: |
          python -m pip install flake8 bandit
          flake8 vote --count --select=E9,F63,F7,F82 --show-source --statistics
          bandit -r vote -ll
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      - name: C# static analysis
        run: dotnet build worker/Worker.csproj -c Release -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest

  unit-tests-and-build:
    name: Dependencies, Unit Tests & Artifact Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vote/requirements.txt
      - name: Install Vote dependencies and run Pytest
        working-directory: vote
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest test_app.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: result/package-lock.json
      - name: Install Result dependencies and validate syntax
        working-directory: result
        run: |
          npm ci
          node --check server.js
          node --check tests/render.js
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      - name: Restore, build and publish Worker
        working-directory: worker
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet publish -c Release --no-build -o out
          test -f out/Worker.dll
      - uses: actions/upload-artifact@v4
        with:
          name: worker-release-binaries
          path: worker/out/
          retention-days: 3
          if-no-files-found: error

  docker-build-and-security-scan:
    name: Docker Build (Dry-Run) & Trivy Security Scan
    needs: [lint-and-sast, unit-tests-and-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all three images without registry push
        run: |
          docker build -t local/voting-app-vote:pr ./vote
          docker build -t local/voting-app-result:pr ./result
          docker build -t local/voting-app-worker:pr ./worker
      - name: Scan repository dependencies with Trivy (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Scan Vote image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/voting-app-vote:pr
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
