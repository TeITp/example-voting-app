name: PR Validation Gate (CI)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint-and-sast:
    name: Linters & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: vote/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: result/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: worker/Dockerfile
          failure-threshold: warning
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Flake8 and Bandit
        run: |
          python -m pip install flake8 bandit
          flake8 vote --count --select=E9,F63,F7,F82 --show-source --statistics
          bandit -r vote -ll
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: C# static analysis
        run: dotnet build worker/Worker.csproj -c Release -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest -warnaserror

  unit-tests-and-build:
    name: Dependencies, Unit Tests & Artifact Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vote/requirements.txt
      - name: Install Vote dependencies and run Pytest
        working-directory: vote
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest test_app.py -v
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: result/package-lock.json
      - name: Install Result dependencies and validate syntax
        working-directory: result
        run: |
          npm ci
          node --check server.js
          node --check tests/render.js
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build and publish Worker
        working-directory: worker
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet publish -c Release --no-build -o out
          test -f out/Worker.dll
      - uses: actions/upload-artifact@v5
        with:
          name: worker-release-binaries
          path: worker/out/
          retention-days: 3
          if-no-files-found: error

  docker-build-and-security-scan:
    name: Docker Build (Dry-Run) & Trivy Security Scan
    needs: [lint-and-sast, unit-tests-and-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build all three images without registry push
        run: |
          docker build -t local/voting-app-vote:pr ./vote
          docker build -t local/voting-app-result:pr ./result
          docker build -t local/voting-app-worker:pr ./worker
      - name: Verify Vote runs as non-root and serves HTTP on 8080
        run: |
          test "$(docker run --rm --entrypoint id local/voting-app-vote:pr -u)" != 0
          docker run -d --name vote-smoke -p 127.0.0.1:5000:8080 local/voting-app-vote:pr
          trap 'docker logs vote-smoke; docker rm -f vote-smoke' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:5000/ | grep -q 'Cats'
      - name: Prepare scan reports
        run: mkdir -p security-reports
      - name: Scan repository dependencies with Trivy (Hard Fail)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: security-reports/dependencies.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Vote image with Trivy (Hard Fail)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/voting-app-vote:pr
          format: table
          output: security-reports/vote.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Result image with Trivy (Hard Fail)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/voting-app-result:pr
          format: table
          output: security-reports/result.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Worker image with Trivy (Hard Fail)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/voting-app-worker:pr
          format: table
          output: security-reports/worker.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Show Trivy vulnerability tables
        if: always()
        run: cat security-reports/*.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trivy-security-reports
          path: security-reports/
          if-no-files-found: warn
